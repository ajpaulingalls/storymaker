pre-commit:
  parallel: false
  commands:
    lint:
      glob: "*.{ts,js}"
      run: bunx eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{ts,js,html,css,json,md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    test:
      glob: "*.{ts,js}"
      run: bun test
